[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoporous"
version = "0.1.0"
description = "Reproducible multiscale nanoparticle diffusion research prototype"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
plots = ["matplotlib>=3.7"]

[project.scripts]
nanoporous = "nanoporous.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 99
